name: Semgrep CI for broadcaster

on:
  push:
    branches: ['prod']
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: semgrep-auth/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    # Dependabot 제외
    if: (github.actor != 'dependabot[bot]')
    
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep(backend-broadcaster)
        run: semgrep --config p/gosec --config p/golang --config p/security-audit . --sarif-output=semgrep.sarif

      # semgrep 결과 gihub ui로 확인 가능
      - name: Upload SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif